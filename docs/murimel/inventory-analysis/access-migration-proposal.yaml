status: "Analise estatica e proposta; sem mudanca de autenticacao, permissoes ou importacao."
evidence_basis: static
observations:
  - source_loc: "Murimel/EasyControl.Prg:555"
    fact: "Login consulta easy_vendedor por codigo e credencial; nome/loja/flags sao hidratados desse registro."
  - source_loc: "Murimel/Easy120.prg:463"
    fact: "Cadastro concentra vendedor comercial, usuario, loja e permissoes; campos de email e inativacao nao aparecem nessa gravacao."
  - source_loc: "Murimel/EasyControl.Prg:263"
    fact: "iMaster abre easy_senha; nao comprova propriedade nem conceder tudo."
  - source_loc: "Murimel/EasyControl.Prg:148"
    fact: "iEasy120 abre cadastro que edita usuarios/permissoes; nao exige iMaster nesse gate."
  - source_loc: "Murimel/Easy200.prg:3086"
    fact: "PDV lista vendedores da loja da sessao; vendedor comissionado selecionado nao e obrigatoriamente operador autenticado."
