  ambiguity:
    source_loc: "Murimel/Easy120.prg:534"
    notes: "Ordem do INSERT conflita com FieldGet de login/MontaCheck a partir do bloco de i301/i503. Revisar schema e amostra de flags por coluna em copia, nao gerar concessao de formulario posicional."
current_target:
  account: "MongoDB users: id, name, email, passwordHash, createdAt. Email normalizado no AuthService."
  login: "Spring Security; BCrypt com fator 12. Nao existe login por codigo legado no contrato atual."
  membership: "PostgreSQL store_memberships(store_id,user_id,role). Uma conta pode ter linhas para varias lojas; nao FK entre Mongo e PostgreSQL."
  roles: "OWNER administra membros; OWNER/MANAGER escrevem catalogo/estoque/pedidos; membros consultam."
  provisioning: "StoreService.create atribui OWNER ao criador; addMember exige OWNER e conta existente, e so permite MANAGER/STAFF."
  gap: "Sem vendedor comercial independente, permissoes granulares por funcao, fluxo dedicado de importacao/convite/redefinicao ou inativacao observado nos contratos de conta e loja lidos."
recommendation:
  preserve_now: "Usuarios/sessoes atuais e seus contratos, incluindo isolamento por membership e checagem no servidor."
  candidates:
    - "Identidade de vendedor comercial por empresa/origem, vinculavel a uma conta nominal; ex-funcionarios continuam no historico sem acesso ativo."
    - "Permissoes por loja e funcao/acao, com perfis como conjuntos iniciais e concessoes explicitas; nunca papel global derivado de iMaster."
    - "Proprietario confirmado administra equipe e poderes; delegacao administrativa, se desejada, exige decisao explicita e trilha de auditoria."
    - "Separar vender, confirmar/receber no caixa, ajustar estoque, precificar, transferir, consultar comissoes e administrar usuarios."
    - "Operador, vendedor da venda e autorizador sao referencias separadas; aprovacao excepcional nominal, com motivo, data e escopo."
    - "Menu reflete capacidades, mas API autoriza cada acao e loja. Funcao ainda inexistente continua indisponivel."
  no_automatic_grants:
    - "iMaster ou presenca em easy_senha nao cria OWNER."
    - "i120 nao concede administracao no destino automaticamente."
    - "Ter permissao de venda nao implica ajustar estoque/preco, cancelar venda ou ler comissoes de todos."
    - "Falta de equivalencia nao promove a MANAGER nem concede leitura geral."
    - "Cadastro legado sem email verificado nao gera email ficticio nem credencial compartilhada."
migration_candidates:
  - source: "easy_vendedor: codigo, vendedor"
    target: "Identidade comercial de origem e eventual conta nominal"
    rule: "Origem/empresa/base+codigo e chave de correspondencia. Mesmo nome ou codigo em bases diferentes nao une identidades sem revisao."
  - source: easy_vendedor.loja
    target: "Loja padrao historica e membership aprovado"
    rule: "Resolver por mapa de lojas; nao assumir acesso a todas as lojas ou mudanca de autoria historica por transferencia de funcionario."
  - source: "easy_vendedor: flags nomeadas"
    target: "Evidencia restrita + proposta de permissoes por loja"
    rule: "Validar DDL e efeitos reais; proprietario revisa/assina concessoes e negativas antes de ativar."
  - source: "Vendedor em easy_vendas/easy_itens/comissao_loja"
    target: "Historico e politicas comerciais vinculados a identidade comercial"
    rule: "Preservar codigos; referencias a vendedor excluido ficam explicitas, sem atribuir a pessoa homonima."
  - source: "oUsuario e demais campos de operador dos documentos"
    target: "Autoria original preservada e eventual correspondencia confirmada"
    rule: "Nome textual nao e userId; se ambiguo, preservar texto e sinalizar ausencia de vinculo em vez de inventar operador."
exclude:
  - "Senhas de vendedor, senhas easy_senha, credenciais de banco e sessoes; nao extrair para staging comum ou logs."
  - "Concessao de proprietario, administracao ou acesso ativo baseada apenas em flags ou nomes antigos."
  - "Reativacao automatica de ex-funcionarios e copia cega de privilegios antigos."
next_small_delivery:
  recommendation: "Aprovar gestao de vendedores/equipe e permissoes por loja antes da ativacao migrada."
  acceptance_candidates:
    - "Proprietario confirmado cadastra/vincula vendedor e decide acesso/loja sem alterar historico de vendas."
    - "Vendedor recebe apenas operacoes aprovadas; PDV e caixa sao capacidades distintas quando implementados."
    - "Usuario de uma loja nao administra nem consulta outra sem concessao explicita."
    - "Acesso negado na API mesmo manipulando menu/URL; operacoes atuais preservadas."
    - "Revogar acesso nao apaga vendedor nem autoria; convite/ativacao/redefinicao deve existir antes de importar contas ativas."
    - "Importacao ensaiada e repetivel, sem duplicar conta/vendedor/membership nem ressuscitar permissao revogada."
  pending_decisions:
    - "Confirmar proprietario(s) real(is), administradores delegados e escopo empresa/rede."
    - "Decidir capacidades por perfil e quem pode conceder/revogar cada uma."
    - "Confirmar pessoas ativas e canal de ativacao; cadastro legado nao fornece email nesse fluxo."
    - "Obter DDL e diagnosticar divergencias de ordem/rotulo antes da carga de flags."
