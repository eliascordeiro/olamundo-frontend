    fields:
      - { name: EasyCodVen, type: "character; codigo do vendedor autenticado convertido por alltrim(str(...))." }
      - { name: CodLoja, type: "valor de FieldGet(2), usado como codigo numerico de loja; DDL nao verificado." }
      - { name: oUsuario, type: "nome do vendedor, retornado por FieldGet(3); nao e ID imutavel." }
      - { name: iMaster, type: "flag de FieldGet(23), gate por igualdade a 1." }
