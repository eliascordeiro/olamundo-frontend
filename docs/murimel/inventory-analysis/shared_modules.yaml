    god_class: true
    split_candidate: true
    migration_strategy: split
    notes: "EasyControl contem menu, login, conexao e autorizacao; whitelist e o recorte de estado observado, nao uma enumeracao completa de todos os globais. Nao portar globais do processo para sessoes web."
